[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "issue-scenario-lab"
version = "0.1.0"
description = "Local HTTP automation foundation for CreteValleyDSS issue variants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
issue-scenario-lab = "issue_scenario_lab.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
